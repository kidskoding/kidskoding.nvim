[session]
default = "Niri"

[appearance]
scheme = "Synced"
theme_mode = "dark"
hide_logo = false
font_family = "JetBrainsMono Nerd Font Mono"

[appearance.palette]
primary = "#fabd2f"
on_primary = "#282828"
secondary = "#83a598"
on_secondary = "#282828"
tertiary = "#b8bb26"
on_tertiary = "#282828"
error = "#fb4934"
on_error = "#282828"
surface = "#282828"
on_surface = "#ebdbb2"
surface_variant = "#3c3836"
on_surface_variant = "#928374"
outline = "#3c3836"
shadow = "#282828"
hover = "#504945"
on_hover = "#ebdbb2"

[appearance.wallpaper]
path = "/etc/noctalia-greeter/wallpaper.jpg"
fill_mode = "crop"

[output]
width = 1920
height = 1080
scale = 1.0

[cursor]
theme = "Adwaita"
size = 32
path = "/run/current-system/sw/share/icons"

[keyboard]
layout = "us"

[idle]
timeout = 330
