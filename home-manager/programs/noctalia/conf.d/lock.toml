[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
enabled = true
timeout = 300
action = "lock"

[idle.behavior.screen-off]
enabled = true
timeout = 330
action = "screen_off"

[idle.behavior.suspend]
enabled = true
timeout = 900
action = "lock_and_suspend"

[lockscreen]
transition = []

[lockscreen_widgets]
enabled = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
type = "login_box"
output = "eDP-1"
cx = 960.0
cy = 540.0
placement_width = 1920.0
placement_height = 1080.0

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_opacity = 1.0
show_unlock_hint = false
center_password_text = true
show_media = false
show_weather = false
show_clock = true
show_battery = true
show_caps_lock = true
show_keyboard_layout = true

[lockscreen_widgets.widget."lockscreen-media@eDP-1"]
type = "media_player"
output = "eDP-1"
cx = 960.0
cy = 800.0
placement_width = 1920.0
placement_height = 1080.0

[lockscreen_widgets.widget."lockscreen-media@eDP-1".settings]
background_opacity = 1.0
hide_when_no_media = true
show_progress = true

[lockscreen_widgets.widget."lockscreen-visualizer@eDP-1"]
type = "audio_visualizer"
output = "eDP-1"
cx = 960.0
cy = 960.0
placement_width = 1920.0
placement_height = 1080.0
box_width = 600.0
box_height = 100.0

[lockscreen_widgets.widget."lockscreen-visualizer@eDP-1".settings]
show_when_idle = false
background = false
